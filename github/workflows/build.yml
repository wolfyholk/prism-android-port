name: Build Qt Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Скачивание кода из репозитория
        uses: actions/checkout@v4

      - name: Установка Java 17 (нужна для Gradle и Android SDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Установка Android NDK и SDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b

      - name: Установка Qt 6 для Android (arm64-v8a)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.6.3'
          host: 'linux'
          target: 'android'
          arch: 'android_arm64_v8a'
          setup-python: 'true'

      - name: Сборка проекта и генерация APK
        run: |
          mkdir build && cd build
          qt-cmake -DANDROID_ABI=arm64-v8a -DANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }} ..
          cmake --build . --target apk

      - name: Загрузка готового APK для скачивания
        uses: actions/upload-artifact@v4
        with:
          name: PrismAndroidTest-APK
          path: build/android-build/build/outputs/apk/debug/*.apk
          
