name: Build Qt Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b

      - name: Install Qt 6 for Android
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.6.3'
          host: 'linux'
          target: 'android'
          arch: 'android_arm64_v8a'
          setup-python: 'true'

      - name: Build APK
        run: |
          mkdir build && cd build
          qt-cmake -DANDROID_ABI=arm64-v8a -DANDROID_SDK_ROOT=$ANDROID_HOME -DANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }} ..
          cmake --build . --target apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PrismAndroidTest-APK
          path: build/android-build/build/outputs/apk/debug/*.apk
