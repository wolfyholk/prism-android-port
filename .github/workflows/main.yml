name: Build Qt Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Qt 6.6.3 for Android
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.6.3'
          host: 'linux'
          target: 'android'
          arch: 'android_arm64_v8a'
          setup-python: 'true'

      - name: Install Android NDK and SDK 33
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;25.1.8937393" "platforms;android-33" "build-tools;33.0.2"

      - name: Build APK
        run: |
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          export ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/25.1.8937393
          mkdir build && cd build
          qt-cmake -GNinja -DANDROID_ABI=arm64-v8a -DANDROID_SDK_ROOT=$ANDROID_SDK_ROOT -DANDROID_NDK_ROOT=$ANDROID_NDK_ROOT ..
          cmake --build . --target PrismAndroidTest
          DEPLOY_TOOL=$(find /home/runner/work/prism-android-port/Qt -name androiddeployqt | head -n 1)
          $DEPLOY_TOOL --input android-PrismAndroidTest-deployment-settings.json --output android-build --android-platform android-33 --jdk $JAVA_HOME --gradle --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PrismAndroidTest-APK
          path: build/android-build/build/outputs/apk/debug/*.apk
